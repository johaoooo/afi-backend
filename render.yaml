services:
  - type: web
    name: afi-backend
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
    startCommand: |
      gunicorn afi_backend.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: afi-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "afi-backend.onrender.com,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://afi-frontend.vercel.app,https://afi-frontend-nine.vercel.app"
    buildFilter:
      paths:
        - backend/**
databases:
  - name: afi-postgres
    databaseName: afi_collection
    user: afi_user
    plan: free
